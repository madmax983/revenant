# Quickstart gate (issue #133).
# static: Node tests and an apex-ls compile of the Hello classes and scripts. No secret.
# smoke: a new scratch org. It deploys, runs HelloWorkflow and verifies it. It records
# the time from deploy start to Completed. It fails if the time is more than
# QUICKSTART_MAX_SECONDS.
# The smoke job needs the DEVHUB_SFDX_AUTH_URL secret. Without it, the job skips.
name: Quickstart

# Each smoke run uses one scratch org from the daily Dev Hub limit.
# So run only when the engine or the quickstart files change.
on:
  push:
    branches: [main]
    paths:
      - "force-app/**"
      - "examples/quickstart/**"
      - "scripts/apex/run-hello.apex"
      - "scripts/apex/verify-hello.apex"
      - "scripts/quickstart/**"
      - "scripts/global-api/apex-ls.mjs"
      - "scripts/global-api/fetch-apex-ls.sh"
      - "config/quickstart-scratch-def.json"
      - "docs/quickstart.md"
      - "README.md"
      - "sfdx-project.json"
      - "package.json"
      - ".github/workflows/quickstart.yml"
  pull_request:
    paths:
      - "force-app/**"
      - "examples/quickstart/**"
      - "scripts/apex/run-hello.apex"
      - "scripts/apex/verify-hello.apex"
      - "scripts/quickstart/**"
      - "scripts/global-api/apex-ls.mjs"
      - "scripts/global-api/fetch-apex-ls.sh"
      - "config/quickstart-scratch-def.json"
      - "docs/quickstart.md"
      - "README.md"
      - "sfdx-project.json"
      - "package.json"
      - ".github/workflows/quickstart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  # Stop old runs of a pull request. Let each run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QUICKSTART_MAX_SECONDS: "600"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch apex-ls
        run: bash scripts/global-api/fetch-apex-ls.sh
      - name: Quickstart tests
        run: npm run test:quickstart
        env:
          REQUIRE_APEX_LS: "1"

  gate:
    name: Dev Hub secret
    runs-on: ubuntu-latest
    outputs:
      devhub: ${{ steps.check.outputs.devhub }}
    steps:
      - id: check
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          if [ -n "$DEVHUB_SFDX_AUTH_URL" ]; then
            echo "devhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "devhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEVHUB_SFDX_AUTH_URL is not set. The scratch org smoke skips. See docs/quickstart.md#ci."
          fi

  smoke:
    name: Scratch org smoke
    needs: [static, gate]
    if: needs.gate.outputs.devhub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The deploy reads every package folder in sfdx-project.json, and one is a submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No version pin: the smoke uses the CLI that a new user installs.
      - name: Install the Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Log in to the Dev Hub
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          auth_file="$RUNNER_TEMP/devhub.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$DEVHUB_SFDX_AUTH_URL" > "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias devhub --set-default-dev-hub
      - name: Create a scratch org
        run: sf org create scratch --definition-file config/quickstart-scratch-def.json --alias hello --duration-days 1 --wait 20
      - name: Smoke (deploy to Completed)
        run: node scripts/quickstart/smoke.mjs --target-org hello --max-seconds "${{ env.QUICKSTART_MAX_SECONDS }}" --result-file quickstart-smoke/result.json
      - name: Keep the smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-smoke
          path: quickstart-smoke/
          if-no-files-found: ignore
      - name: Hello Apex tests
        run: sf apex run test --class-names HelloWorkflowTest --class-names HelloWorkflowCheckTest --target-org hello --result-format human --wait 20
      - name: Delete the scratch org
        if: always()
        run: sf org delete scratch --target-org hello --no-prompt || true

<template>
    <div class="topology">
        <template if:true={loading}>
            <div data-id="topology-loading" aria-live="polite" aria-busy="true" class="slds-box slds-text-color_weak slds-text-align_center">
                Loading the workflow graph…
            </div>
        </template>

        <template if:true={error}>
            <div data-id="topology-error" role="alert" class="slds-box slds-text-align_center">
                <lightning-icon icon-name="utility:warning" size="xx-small" alternative-text="Warning" class="slds-m-right_xx-small"></lightning-icon>
                The workflow graph is not available.
                <div class="slds-text-body_small slds-text-color_weak">{error}</div>
            </div>
        </template>

        <template if:true={hasGraph}>
            <template if:true={hasOverlay}>
                <div data-id="topology-summary" class="slds-box slds-m-bottom_small topology-summary" role="status">
                    <dl class="slds-list_horizontal slds-wrap">
                        <dt class="slds-item_label slds-text-color_weak">Current step</dt>
                        <dd class="slds-item_detail" data-id="summary-current"><strong>{currentLabel}</strong></dd>
                        <dt class="slds-item_label slds-text-color_weak">State</dt>
                        <dd class="slds-item_detail" data-id="summary-state">{stateLabel}</dd>
                        <template if:true={isAwaiting}>
                            <dt class="slds-item_label slds-text-color_weak">Advances on</dt>
                            <dd class="slds-item_detail font-mono" data-id="summary-awaiting">{awaitedLabel}</dd>
                        </template>
                        <dt class="slds-item_label slds-text-color_weak">Possible next steps</dt>
                        <dd class="slds-item_detail" data-id="summary-next">{nextLabel}</dd>
                    </dl>
                    <template if:true={showNextCaveat}>
                        <p data-id="summary-next-caveat" class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                            Step output can route to other steps. This list shows only the routes that the probe found.
                        </p>
                    </template>
                </div>
            </template>

            <template if:true={showNotice}>
                <div data-id="topology-notice" role="status" class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_small topology-notice">
                    <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Warning" class="slds-m-right_x-small"></lightning-icon>
                    <div class="slds-text-align_left">
                        <p><strong>Routing is not fully known statically.</strong> The graph shows the known steps and edges only. It is not complete.</p>
                        <ul class="slds-list_dotted">
                            <template for:each={reasonRows} for:item="r">
                                <li key={r.key} data-id="topology-reason">{r.label}</li>
                            </template>
                        </ul>
                    </div>
                </div>
            </template>

            <p data-id="topology-best-effort" class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                Edges come from a best-effort probe of getNextStep. A missing edge does not prove that no route exists.
            </p>

            <template if:true={isEmpty}>
                <div data-id="topology-empty" class="slds-box slds-text-color_weak slds-text-align_center">
                    No step is known for this workflow.
                </div>
            </template>

            <template if:false={isEmpty}>
                <div class="topology-canvas">
                    <svg data-id="topology-svg" class="topology-svg" width={svgWidth} height={svgHeight} viewBox={viewBox} role="img" aria-label={svgLabel}>
                        <template for:each={edgeViews} for:item="e">
                            <g key={e.key}>
                                <path data-id="topology-edge" class={e.cssClass} d={e.d}></path>
                                <polygon class={e.arrowClass} points={e.arrow}></polygon>
                            </g>
                        </template>
                        <template for:each={nodeViews} for:item="n">
                            <g key={n.key} data-id="topology-node" data-name={n.name} class={n.cssClass} transform={n.transform}>
                                <title>{n.title}</title>
                                <rect class="node-box" width={n.width} height={n.height} rx="6" ry="6"></rect>
                                <text class="node-label" x="10" y="20">{n.label}</text>
                                <text class="node-badges" x="10" y="36">{n.badges}</text>
                                <template if:true={n.awaiting}>
                                    <text class="node-awaiting" x="10" y="50">{n.awaiting}</text>
                                </template>
                            </g>
                        </template>
                    </svg>
                </div>

                <ul data-id="topology-legend" class="slds-list_horizontal slds-wrap slds-text-body_small slds-text-color_weak slds-m-top_x-small topology-legend">
                    <li class="slds-m-right_medium"><span class="legend-swatch legend-initial"></span>Start: initial step</li>
                    <li class="slds-m-right_medium"><span class="legend-swatch legend-terminal"></span>Can end: no successor</li>
                    <li class="slds-m-right_medium"><span class="legend-swatch legend-rollback"></span>Rollback: CompensatableStep</li>
                    <li class="slds-m-right_medium"><span class="legend-swatch legend-unknown"></span>?: routing not known</li>
                    <li class="slds-m-right_medium"><span class="legend-swatch legend-unreached"></span>Dashed: no known route to it</li>
                    <template if:true={hasOverlay}>
                        <li class="slds-m-right_medium"><span class="legend-swatch legend-current"></span>Current step</li>
                        <li class="slds-m-right_medium"><span class="legend-swatch legend-visited"></span>Visited by this run</li>
                    </template>
                </ul>

                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_small" aria-label="Steps and known next steps">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate" title="Step">Step</div></th>
                            <th scope="col"><div class="slds-truncate" title="Known next steps">Known next steps</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rows} for:item="row">
                            <tr key={row.key} data-id="topology-row" data-name={row.name}>
                                <td><span title={row.name}>{row.label}</span></td>
                                <td>{row.nextText}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:true={hasPath}>
                <h4 class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Path of this run</h4>
                <template if:true={pathTruncated}>
                    <p data-id="topology-truncated" class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                        The path shows only the newest step rows.
                    </p>
                </template>
                <ol class="topology-path">
                    <template for:each={pathRows} for:item="p">
                        <li key={p.key} data-id="topology-path-entry" class="topology-path-entry">
                            <span class="path-order">{p.order}.</span>
                            <span class="path-label">{p.label}</span>
                            <template if:true={p.compensation}>
                                <span class="badge-rollback">Rollback</span>
                            </template>
                            <span class="slds-text-color_weak path-status">{p.status}</span>
                        </li>
                    </template>
                </ol>
            </template>

            <template if:true={hasDefects}>
                <h4 class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Definition defects</h4>
                <ul class="slds-list_dotted">
                    <template for:each={defectRows} for:item="d">
                        <li key={d.key} data-id="topology-defect" class="slds-text-color_error">{d.message}</li>
                    </template>
                </ul>
            </template>
        </template>
    </div>
</template>
